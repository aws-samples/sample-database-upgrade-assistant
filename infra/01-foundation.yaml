AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RDS Upgrade Assistant Foundation Infrastructure.
  DynamoDB tables, S3 buckets, CloudFront, Step Functions, Lambda functions, IAM roles.
  

# ============================================================================
# Parameters
# ============================================================================
Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    Description: ExternalId for cross-account STS AssumeRole

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID (for Lambda functions needing VPC access)

  SubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of private subnet IDs (must have NAT Gateway route for outbound internet)

  LambdaRoleArn:
    Type: String
    Default: ''
    Description: (Optional) Pre-created Lambda execution role ARN. If empty, role is created inline.

  SfnRoleArn:
    Type: String
    Default: ''
    Description: (Optional) Pre-created Step Functions execution role ARN. If empty, role is created inline.

Conditions:
  CreateLambdaRole: !Equals [!Ref LambdaRoleArn, '']
  CreateSfnRole: !Equals [!Ref SfnRoleArn, '']

# ============================================================================
# Resources
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # KMS Key for DynamoDB Encryption
  # --------------------------------------------------------------------------
  DynamoDBKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for RDS Upgrade Assistant DynamoDB encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:Encrypt
              - kms:ReEncrypt*
            Resource: '*'
      EnableKeyRotation: true

  DynamoDBKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/aurora-upgrade-planner-dynamodb
      TargetKeyId: !Ref DynamoDBKMSKey

  # --------------------------------------------------------------------------
  # DynamoDB Tables
  # --------------------------------------------------------------------------
  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aurora-upgrade-planner-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
        - AttributeName: agentType
          AttributeType: S
        - AttributeName: startTime
          AttributeType: S
        - AttributeName: inputHash
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: agentType-startTime-index
          KeySchema:
            - AttributeName: agentType
              KeyType: HASH
            - AttributeName: startTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: inputHash-index
          KeySchema:
            - AttributeName: inputHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DynamoDBKMSKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aurora-upgrade-planner-findings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
        - AttributeName: findingId
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH
        - AttributeName: findingId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DynamoDBKMSKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProgressEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aurora-upgrade-planner-progress-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DynamoDBKMSKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aurora-upgrade-planner-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DynamoDBKMSKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aurora-upgrade-planner-settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: settingKey
          AttributeType: S
      KeySchema:
        - AttributeName: settingKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DynamoDBKMSKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --------------------------------------------------------------------------
  # SQS Dead Letter Queue for Lambda Functions
  # --------------------------------------------------------------------------
  LambdaDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: aurora-upgrade-planner-lambda-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  # --------------------------------------------------------------------------
  # Security Group for Lambda Functions (VPC)
  # --------------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS Upgrade Assistant Lambda functions
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound (AWS APIs, Bedrock, GitHub)
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL (Aurora clone connectivity)
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: PostgreSQL (Aurora clone connectivity)

  # --------------------------------------------------------------------------
  # S3 Buckets
  # --------------------------------------------------------------------------
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aurora-upgrade-planner-logs-${AWS::AccountId}-${AWS::Region}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: 90

  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonHTTPS
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !GetAtt LoggingBucket.Arn
              - !Sub ${LoggingBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowS3Logging
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${LoggingBucket.Arn}/*

  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aurora-upgrade-planner-reports-${AWS::AccountId}-${AWS::Region}
      ObjectLockEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: report-bucket/
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIntelligentTiering
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 90
          - Id: ExpireOldReports
            Status: Enabled
            Prefix: upgrade-tests/
            ExpirationInDays: 180
          - Id: ExpireOldFindings
            Status: Enabled
            Prefix: findings/
            ExpirationInDays: 180
          - Id: ExpireOldClusterAnalysis
            Status: Enabled
            Prefix: cluster-analysis/
            ExpirationInDays: 180
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aurora-upgrade-planner-frontend-${AWS::AccountId}-${AWS::Region}
      ObjectLockEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: frontend-bucket/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
          - Sid: DenyNonHTTPS
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonHTTPS
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !GetAtt ReportBucket.Arn
              - !Sub ${ReportBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # --------------------------------------------------------------------------
  # CloudFront Distribution
  # --------------------------------------------------------------------------
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: OAI for RDS Upgrade Assistant frontend

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOAI}
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        Logging:
          Bucket: !GetAtt LoggingBucket.DomainName
          IncludeCookies: false
          Prefix: cloudfront/
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # --------------------------------------------------------------------------
  # IAM Role - Shared Lambda Execution Role
  # --------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRole
    Properties:
      RoleName: aurora-upgrade-planner-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaExecutionPolicy

  LambdaExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateLambdaRole
    Properties:
      ManagedPolicyName: aurora-upgrade-planner-lambda-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aurora-upgrade-planner-*
          - Sid: S3ReadWrite
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:HeadObject
            Resource:
              - !GetAtt ReportBucket.Arn
              - !Sub ${ReportBucket.Arn}/*
          - Sid: DynamoDBCRUD
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt RunsTable.Arn
              - !Sub ${RunsTable.Arn}/index/*
              - !GetAtt FindingsTable.Arn
              - !GetAtt ProgressEventsTable.Arn
              - !GetAtt ConnectionsTable.Arn
              - !GetAtt SettingsTable.Arn
          - Sid: KMSDecryptForDynamoDB
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !GetAtt DynamoDBKMSKey.Arn
          - Sid: RDSReadOnly
            Effect: Allow
            Action:
              - rds:DescribeDBEngineVersions
              - rds:DescribeDBClusters
              - rds:DescribeDBInstances
              - rds:DescribeDBClusterParameters
              - rds:DescribeDBClusterSnapshots
            Resource: '*'
          - Sid: RDSCloneAndUpgrade
            Effect: Allow
            Action:
              - rds:RestoreDBClusterToPointInTime
              - rds:RestoreDBClusterFromSnapshot
              - rds:CopyDBClusterSnapshot
            Resource:
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:subgrp:*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:*
          - Sid: RDSWriteOnClones
            Effect: Allow
            Action:
              - rds:CreateDBInstance
              - rds:ModifyDBCluster
              - rds:DeleteDBCluster
              - rds:DeleteDBInstance
              - rds:DeleteDBClusterSnapshot
              - rds:AddTagsToResource
            Resource:
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:aurora-planner-test-*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:aurora-planner-test-*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:aurora-planner-*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster-pg:aurora-planner-*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster-pg:default.*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:pg:aurora-planner-*
              - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:pg:default.*
          - Sid: PerformanceInsights
            Effect: Allow
            Action:
              - pi:GetResourceMetrics
            Resource: '*'
          - Sid: LambdaInvoke
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-*
          - Sid: StepFunctionsStart
            Effect: Allow
            Action:
              - states:StartExecution
            Resource: !GetAtt UpgradeTestStateMachine.Arn
          - Sid: STSAssumeRole
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: !Sub arn:aws:iam::*:role/aurora-upgrade-planner-cross-account-role
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Sid: STSIdentity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: '*'
          - Sid: BedrockListModels
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
            Resource: '*'
          - Sid: AgentCoreInvoke
            Effect: Allow
            Action:
              - bedrock-agentcore:InvokeAgentRuntime
            Resource:
              - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
          - Sid: SecretsManagerGitHub
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:aurora-upgrade-planner/*
          - Sid: SQSDLQWrite
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDLQ.Arn
          - Sid: VPCNetworkInterfaces
            # Resource: '*' is required for Lambda VPC attachment — ENI ARNs are
            # assigned at runtime and cannot be scoped at deploy time.
            # See: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
            Resource: '*'

  # --------------------------------------------------------------------------
  # Step Functions State Machine
  # --------------------------------------------------------------------------
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Condition: CreateSfnRole
    Properties:
      RoleName: aurora-upgrade-planner-sfn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StepFunctionsPolicy

  StepFunctionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateSfnRole
    Properties:
      ManagedPolicyName: aurora-upgrade-planner-sfn-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-*

  UpgradeTestStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: aurora-upgrade-planner-upgrade-test
      StateMachineType: STANDARD
      RoleArn: !If [CreateSfnRole, !GetAtt StepFunctionsRole.Arn, !Ref SfnRoleArn]
      DefinitionString: !Sub |
        {
          "Comment": "Aurora Upgrade Test Pipeline — Baseline → Clone → WaitForClone → Upgrade → WaitForUpgrade → Validation → Cleanup",
          "StartAt": "Baseline",
          "States": {
            "Baseline": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-baseline",
              "ResultPath": "$.stepResult",
              "TimeoutSeconds": 900,
              "Next": "Clone",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "BaselineFailed"
                }
              ]
            },
            "BaselineFailed": {
              "Type": "Pass",
              "Comment": "Baseline failed before clone was created — no cleanup needed",
              "End": true
            },
            "Clone": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-clone",
              "InputPath": "$.stepResult",
              "ResultPath": "$.stepResult",
              "TimeoutSeconds": 900,
              "Next": "InitClonePollCount",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "CloneCreateFailed"
                }
              ]
            },
            "CloneCreateFailed": {
              "Type": "Pass",
              "Comment": "Clone creation threw an error. Pass runId so Cleanup can look up cloneId from DynamoDB.",
              "Parameters": {
                "runId.$": "$.stepResult.runId",
                "cloneId": ""
              },
              "ResultPath": "$.stepResult",
              "Next": "Cleanup"
            },
            "InitClonePollCount": {
              "Type": "Pass",
              "Result": {"count": 0},
              "ResultPath": "$.pollCount",
              "Next": "WaitForClone"
            },
            "WaitForClone": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "PollCloneStatus"
            },
            "PollCloneStatus": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-poll-status",
              "InputPath": "$.stepResult",
              "ResultPath": "$.pollResult",
              "TimeoutSeconds": 900,
              "Next": "IncrementClonePollCount",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "Cleanup"
                }
              ]
            },
            "IncrementClonePollCount": {
              "Type": "Pass",
              "Parameters": {
                "count.$": "States.MathAdd($.pollCount.count, 1)"
              },
              "ResultPath": "$.pollCount",
              "Next": "CheckCloneStatus"
            },
            "CheckCloneStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.pollResult.status",
                  "StringEquals": "available",
                  "Next": "Upgrade"
                },
                {
                  "Variable": "$.pollResult.status",
                  "StringEquals": "failed",
                  "Next": "CloneFailed"
                },
                {
                  "Variable": "$.pollResult.status",
                  "StringEquals": "deleting",
                  "Next": "CloneFailed"
                },
                {
                  "Variable": "$.pollCount.count",
                  "NumericGreaterThanEquals": 60,
                  "Next": "CloneTimeout"
                }
              ],
              "Default": "WaitForClone"
            },
            "CloneFailed": {
              "Type": "Pass",
              "Result": {"error": "CloneFailed", "cause": "Clone cluster entered failed or deleting state"},
              "ResultPath": "$.failureInfo",
              "Next": "Cleanup"
            },
            "CloneTimeout": {
              "Type": "Pass",
              "Result": {"error": "CloneTimeout", "cause": "Clone did not become available within 60 minutes"},
              "ResultPath": "$.failureInfo",
              "Next": "Cleanup"
            },
            "Upgrade": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-upgrade",
              "Parameters": {
                "runId.$": "$.stepResult.runId",
                "cloneId.$": "$.stepResult.cloneId"
              },
              "ResultPath": "$.stepResult",
              "TimeoutSeconds": 900,
              "Next": "InitUpgradePollCount",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "Cleanup"
                }
              ]
            },
            "InitUpgradePollCount": {
              "Type": "Pass",
              "Result": {"count": 0},
              "ResultPath": "$.pollCount",
              "Next": "WaitForUpgrade"
            },
            "WaitForUpgrade": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "PollUpgradeStatus"
            },
            "PollUpgradeStatus": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-poll-status",
              "InputPath": "$.stepResult",
              "ResultPath": "$.pollResult",
              "TimeoutSeconds": 900,
              "Next": "IncrementUpgradePollCount",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "Cleanup"
                }
              ]
            },
            "IncrementUpgradePollCount": {
              "Type": "Pass",
              "Parameters": {
                "count.$": "States.MathAdd($.pollCount.count, 1)"
              },
              "ResultPath": "$.pollCount",
              "Next": "CheckUpgradeStatus"
            },
            "CheckUpgradeStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.pollResult.status",
                  "StringEquals": "available",
                  "Next": "Validation"
                },
                {
                  "Variable": "$.pollResult.status",
                  "StringEquals": "failed",
                  "Next": "UpgradeFailed"
                },
                {
                  "Variable": "$.pollResult.status",
                  "StringEquals": "deleting",
                  "Next": "UpgradeFailed"
                },
                {
                  "Variable": "$.pollCount.count",
                  "NumericGreaterThanEquals": 60,
                  "Next": "UpgradeTimeout"
                }
              ],
              "Default": "WaitForUpgrade"
            },
            "UpgradeFailed": {
              "Type": "Pass",
              "Result": {"error": "UpgradeFailed", "cause": "Upgrade cluster entered failed or deleting state"},
              "ResultPath": "$.failureInfo",
              "Next": "Cleanup"
            },
            "UpgradeTimeout": {
              "Type": "Pass",
              "Result": {"error": "UpgradeTimeout", "cause": "Upgrade did not complete within 60 minutes"},
              "ResultPath": "$.failureInfo",
              "Next": "Cleanup"
            },
            "Validation": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-validation",
              "Parameters": {
                "runId.$": "$.stepResult.runId",
                "cloneId.$": "$.stepResult.cloneId"
              },
              "ResultPath": "$.stepResult",
              "TimeoutSeconds": 900,
              "Next": "Cleanup",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "Cleanup"
                }
              ]
            },
            "Cleanup": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aurora-upgrade-planner-cleanup",
              "Parameters": {
                "runId.$": "$.stepResult.runId",
                "cloneId.$": "$.stepResult.cloneId"
              },
              "TimeoutSeconds": 900,
              "End": true,
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "CleanupFailed"
                }
              ]
            },
            "CleanupFailed": {
              "Type": "Fail",
              "Error": "CleanupFailed",
              "Cause": "Cleanup Lambda failed — manual clone deletion may be required"
            }
          }
        }

